services:
  postgres:
    image: postgres:16-alpine
    container_name: swasemi-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-swasemi_coldchain}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-swasemi_coldchain}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: swasemi-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swasemi-backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-swasemi_coldchain}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MQTT_BROKER=${MQTT_BROKER:-broker.emqx.io}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey_change_in_production_36hr_assessment}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swasemi-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: swasemi-simulator
    restart: always
    environment:
      - MQTT_BROKER=${MQTT_BROKER:-broker.emqx.io}
    depends_on:
      - backend


volumes:
  postgres_data:
  redis_data:
